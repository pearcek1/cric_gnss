<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Cricket Tools</title>
<style>
:root{color-scheme:dark;--bg:#101820;--card:#1b2934;--border:#344755;--text:#f3f7fa;--muted:#a9bac6;--accent:#64d99b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px)}h1{font-size:clamp(2rem,7vw,2.7rem);margin:0 0 8px}p{color:var(--muted);margin:0 0 28px;line-height:1.5}.tools{display:grid;gap:14px}
a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:110px;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--card);color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}a:hover,a:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}.name{font-size:1.2rem;font-weight:750}.desc{font-size:.9rem;color:var(--muted);margin-top:6px}.arrow{font-size:1.7rem;color:var(--accent)}footer{text-align:center;margin-top:28px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>🏏 Cricket Tools</h1>
<p>Choose a tool to get started.</p>
<nav class="tools" aria-label="Cricket tools">
<a href="./gnss/"><span><span class="name">Cricket GNSS</span><span class="desc" style="display:block">Shot tracking and analysis</span></span><span class="arrow" aria-hidden="true">→</span></a>
<a href="./clicker/"><span><span class="name">Bowling Clicker</span><span class="desc" style="display:block">U11 overs and bowling lineup</span></span><span class="arrow" aria-hidden="true">→</span></a>
</nav>
<footer>Ready for match day</footer>
</main>
</body>
</html>
